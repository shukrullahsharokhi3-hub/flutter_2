<!DOCTYPE html>
<html>
  <head>
    <!-- The base href is replaced by Flutter when the web app is built. -->
    <base href="$FLUTTER_BASE_HREF" />
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <!-- Flutter Web installs its own viewport tag when the app starts. -->
    <meta name="description" content="GFMS Mobile garment factory management system." />
    <title>GFMS Mobile</title>
  </head>
  <body>
    <!-- Flutter injects and starts its compiled web application here. -->
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
